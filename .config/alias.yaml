## scoop
ss: scoop search
si: scoop install
gsi: gsudo scoop install
rsi: scoop-reinstall
su: scoop uninstall
rset: gsudo scoop reset
sh: scoop home
sio: scoop info
sup: scoop update
sua: scoop update -a -k
scc: scoop cleanup * && scoop cache rm *

## Tabby
tbon: gsudo servy-cli start --name="Tabby"
tboff: gsudo servy-cli stop --name="Tabby"
tbs: servy-cli status --name="Tabby"